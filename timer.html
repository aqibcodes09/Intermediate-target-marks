<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Timer with Cat Alarm 🐾</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 8px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .timer-display {
            font-size: 48px;
            font-weight: bold;
            color: #facc15;
            letter-spacing: 2px;
            margin: 20px 0;
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #334155;
        }

        .inputs-grid {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-group label {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 75px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 18px;
            text-align: center;
            outline: none;
        }

        .input-group input:focus {
            border-color: #38bdf8;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-start { background: #22c55e; color: white; }
        .btn-pause { background: #eab308; color: black; }
        .btn-reset { background: #ef4444; color: white; }

        button:hover {
            opacity: 0.9;
        }

        .cat-badge {
            margin-top: 20px;
            font-size: 14px;
            color: #f472b6;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Study Focus Timer 🐱</h1>
    <p>Apna study duration set karein aur focus karein!</p>

    <div class="inputs-grid">
        <div class="input-group">
            <label>Hours</label>
            <input type="number" id="hrs" min="0" max="23" value="0">
        </div>
        <div class="input-group">
            <label>Minutes</label>
            <input type="number" id="mins" min="0" max="59" value="25">
        </div>
        <div class="input-group">
            <label>Seconds</label>
            <input type="number" id="secs" min="0" max="59" value="0">
        </div>
    </div>

    <div class="timer-display" id="display">00:25:00</div>

    <div class="btn-group">
        <button class="btn-start" onclick="startTimer()">Start 🚀</button>
        <button class="btn-pause" onclick="pauseTimer()">Pause ⏸️</button>
        <button class="btn-reset" onclick="resetTimer()">Reset 🔄</button>
    </div>

    <div class="cat-badge" id="statusMsg">Timer khatam hone par Cat Meow sound bajegi! 🐾</div>
</div>

<script>
    let totalSeconds = 0;
    let timerInterval = null;
    let isRunning = false;

    // Cat Meow Sound effect (Web Audio API)
    function playCatMeow() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Sound 1: High Meow
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(700, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 0.6);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
    }

    function updateDisplay() {
        let h = Math.floor(totalSeconds / 3600);
        let m = Math.floor((totalSeconds % 3600) / 60);
        let s = totalSeconds % 60;

        let hStr = h < 10 ? "0" + h : h;
        let mStr = m < 10 ? "0" + m : m;
        let sStr = s < 10 ? "0" + s : s;

        document.getElementById('display').innerText = `${hStr}:${mStr}:${sStr}`;
    }

    function startTimer() {
        if (isRunning) return;

        if (totalSeconds === 0) {
            let h = parseInt(document.getElementById('hrs').value) || 0;
            let m = parseInt(document.getElementById('mins').value) || 0;
            let s = parseInt(document.getElementById('secs').value) || 0;
            totalSeconds = h * 3600 + m * 60 + s;
        }

        if (totalSeconds <= 0) return;

        isRunning = true;
        document.getElementById('statusMsg').innerText = "Study Mode ON! Focus Karein 📖";

        timerInterval = setInterval(() => {
            totalSeconds--;
            updateDisplay();

            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                isRunning = false;
                document.getElementById('statusMsg').innerText = "Time Over! Great Job! 🐾 Meow!";
                
                // Play Cat Sound 3 times
                playCatMeow();
                setTimeout(playCatMeow, 700);
                setTimeout(playCatMeow, 1400);
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerInterval);
        isRunning = false;
        document.getElementById('statusMsg').innerText = "Timer Paused ⏸️";
    }

    function resetTimer() {
        clearInterval(timerInterval);
        isRunning = false;
        totalSeconds = 0;
        document.getElementById('hrs').value = 0;
        document.getElementById('mins').value = 25;
        document.getElementById('secs').value = 0;
        document.getElementById('display').innerText = "00:25:00";
        document.getElementById('statusMsg').innerText = "Timer Reset Ho Gaya Hai.";
    }
</script>

</body>
</html>
